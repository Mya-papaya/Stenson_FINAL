<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Virtual Art Gallery</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #333;
            color: white;
            overflow: hidden;
        }

        .screen {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            padding: 1rem;
            text-align: center;
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0s 0.8s;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease, visibility 0s 0s;
        }

        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .media-container {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            cursor: crosshair; /* Change cursor to indicate interactivity */
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Magnifying Glass */
        .magnifier {
            position: absolute;
            border: 3px solid white;
            border-radius: 50%;
            cursor: none;
            width: 100px;
            height: 100px;
            pointer-events: none;
            background-repeat: no-repeat;
            background-size: 200%;
            background-position: center;
            opacity: 1; /* Make the magnifier fully visible */
        }

        .arrow, .enter-btn {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .arrow:hover, .enter-btn:hover {
            background-color: #ddd;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Entrance Screen -->
    <div id="poster" class="screen active" style="background-image: url('media/gallery-poster.png');">
        <div class="media-container">
            <img src="media/gallery-poster.png" alt="Gallery Poster">
        </div>
        <button class="enter-btn" onclick="enterMockup()">Enter Gallery</button>
    </div>

    <!-- Mockup View -->
    <div id="mockup" class="screen" style="background-image: url('media/arched-gallery.jpg');">
        <div class="media-container">
            <img src="media/arched-gallery.jpg" alt="Gallery Mockup">
        </div>
        <button class="enter-btn" onclick="viewArtwork()">View Artwork</button>
    </div>

    <!-- Individual Artwork Navigation -->
    <div id="artwork-view" class="screen" style="background-image: url('media/a1.png');">
        <div class="media-container" id="art-container">
            <img id="art-image" src="media/a1.png" alt="Art Piece">
            <!-- Magnifying Glass -->
            <div class="magnifier" id="magnifier"></div>
        </div>
        <div class="controls">
            <button class="arrow" onclick="prevArt()">←</button>
            <button class="arrow" onclick="nextArt()">→</button>
        </div>
    </div>

    <!-- Thank You Screen -->
    <div id="thank-you" class="screen" style="background-color: #222;">
        <div class="media-container">
            <h1>Thank you for visiting my gallery. Your time means the world to me.</h1>
            <p>- Mya Stenson ♡</p>
        </div>
        <button class="enter-btn" onclick="exitGallery()">Exit</button>
    </div>

    <script>
        const artPieces = [
            'media/a1.png',
            'media/a2.png',
            'media/a3.png',
            'media/a4.png',
            'media/a5.png',
            'media/a6.png',
            'media/a7.png',
            'media/a8.png',
            'media/headshot.jpg'
        ];
        let currentArtIndex = 0;

        function switchScreen(fromId, toId) {
            const from = document.getElementById(fromId);
            const to = document.getElementById(toId);
            from.classList.remove('active');
            setTimeout(() => {
                to.classList.add('active');
            }, 50); // Slight delay to ensure CSS transition
        }

        function enterMockup() {
            switchScreen('poster', 'mockup');
        }

        function viewArtwork() {
            switchScreen('mockup', 'artwork-view');
            updateArtView();
        }

        function updateArtView() {
            const artSrc = artPieces[currentArtIndex];
            document.getElementById('art-image').src = artSrc;
            document.getElementById('artwork-view').style.backgroundImage = `url(${artSrc})`;

            // Update magnifier background image to the current artwork
            const magnifier = document.getElementById('magnifier');
            magnifier.style.backgroundImage = `url(${artSrc})`;
        }

        function prevArt() {
            currentArtIndex = (currentArtIndex - 1 + artPieces.length) % artPieces.length;
            updateArtView();
        }

        function nextArt() {
            if (currentArtIndex === artPieces.length - 1) {
                showThankYouScreen();
            } else {
                currentArtIndex = (currentArtIndex + 1) % artPieces.length;
                updateArtView();
            }
        }

        function showThankYouScreen() {
            switchScreen('artwork-view', 'thank-you');
        }

        function exitGallery() {
            alert("Goodbye! Hope to see you again."); // Optional message
        
        }

        // Magnifying Glass Functionality
        const magnifier = document.getElementById('magnifier');
        const artContainer = document.getElementById('art-container');

        artContainer.addEventListener('mousemove', (e) => {
            const containerRect = artContainer.getBoundingClientRect();
            const offsetX = e.clientX - containerRect.left;
            const offsetY = e.clientY - containerRect.top;

            magnifier.style.left = `${offsetX - magnifier.offsetWidth / 2}px`;
            magnifier.style.top = `${offsetY - magnifier.offsetHeight / 2}px`;

            // Set background position to zoom in on the area under the magnifier
            magnifier.style.backgroundPosition = `-${offsetX * 2 - magnifier.offsetWidth / 2}px -${offsetY * 2 - magnifier.offsetHeight / 2}px`;

            // Adjust background size for zoom effect
            magnifier.style.backgroundSize = `${artContainer.offsetWidth * 2}px ${artContainer.offsetHeight * 2}px`;
        });

        artContainer.addEventListener('mouseenter', () => {
            magnifier.style.display = 'block';  // Show magnifier when mouse enters the image
        });

        artContainer.addEventListener('mouseleave', () => {
            magnifier.style.display = 'none';  // Hide magnifier when mouse leaves the image
        });
    </script>
</body>
</html>
